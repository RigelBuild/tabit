# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'library'
language: 'typescript'
tags: ['bun']

tasks:
  install:
    command: 'bun install --frozen-lockfile'
    inputs: ['/package.json', '/bun.lock', '/bunfig.toml']
    options:
      internal: true
      cache: false
      runFromWorkspaceRoot: true

  lint:
    command: 'biome check .'
    deps: ['install']
    options:
      cache: false
      runFromWorkspaceRoot: true

  markdownlint:
    command: 'rumdl check .'
    deps: ['install']
    options:
      cache: false
      runFromWorkspaceRoot: true

  refgate:
    command: 'bun node_modules/@rigelbuild/ref-gate/index.ts --config ref-gate.config.json'
    deps: ['install']
    options:
      cache: false
      runFromWorkspaceRoot: true

  typecheck:
    command: 'bun run tsc --noEmit -p .'
    deps: ['install']

  test:
    command: 'bun test'
    deps: ['install']

  ci:
    deps: ['lint', 'markdownlint', 'refgate', 'typecheck', 'test']
    options:
      cache: false
